[package]
name = "puerperium-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Puerperium MCP-over-stdio server — the agent face (nursery_* tools)"

[lib]
name = "puerperium_mcp"
path = "src/lib.rs"

[[bin]]
name = "puerperium-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
puerperium = { path = "../puerperium" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
